name: groq-train

on:
  schedule:
    # احتياطي: كل 20 دقيقة (GitHub المجاني يخفف المجدول أحياناً، لذا نعتمد أساساً على cron-job.org)
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "عدد الدروس في هذه الدورة"
        required: false
        default: "10"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
          - "10"
  repository_dispatch:
    types: [train-now]

concurrency:
  group: groq-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_ENABLED: "true"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.QWEN_API_KEY }}
      GROQ_BASE_URL: ${{ secrets.GROQ_BASE_URL || 'https://api.groq.com/openai/v1' }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      GROQ_PROVIDER: ${{ secrets.GROQ_PROVIDER || 'openai' }}
      GROQ_MAX_TOKENS: ${{ vars.GROQ_MAX_TOKENS || '8000' }}
      TRAIN_BATCH: ${{ inputs.batch || vars.TRAIN_BATCH || '10' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Train one cycle
        run: npx tsx scripts/train-cron.ts